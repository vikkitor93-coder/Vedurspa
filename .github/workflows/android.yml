name: Build Android APK

on:
  push:
    branches: [main, ci-build-vedurspa-1.6.31-guides-languages]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source
        shell: bash
        run: |
          cat ci-src/part-* > /tmp/vedurspa-source.zip
          echo "dccbb8a68cae3443447bbe488e3ac1f8bf96dafce274b0020b1c8e8b3d51a563  /tmp/vedurspa-source.zip" | sha256sum -c -
          mkdir -p app
          unzip -q /tmp/vedurspa-source.zip -d app
          base64 -d ci-src/v12.patch.gz.b64 | gunzip > /tmp/v12.patch
          patch -p1 -d app < /tmp/v12.patch
          patch -p1 -d app < ci-src/v12fix.patch
          base64 -d ci-src/v13.patch.gz.b64 | gunzip > /tmp/v13.patch
          patch -p1 -d app < /tmp/v13.patch
          cat ci-src/v15/part-* > /tmp/v15.patch.gz.b64
          echo "48f57b34c80cf2c823c95a36f1951e853c512530daa65b3c6e53f2ce4cedb7ae  /tmp/v15.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/v15.patch.gz.b64 | gunzip > /tmp/v15.patch
          echo "ac3a61871b9971f3eb45231bddc49eec9931c0ce9b99113880c4d38316508132  /tmp/v15.patch" | sha256sum -c -
          patch -p1 -d app < /tmp/v15.patch
          patch -p1 -d app < ci-src/v15fix.patch
          patch -p1 -d app < ci-src/v15fix2.patch
          cat ci-src/v16-overlay/part-* > /tmp/v16-overlay.tar.gz.b64
          echo "d21fb42ca1788a11ee8f5c12fdb88900d868b199ae7520a929fbe8e5ccc546b1  /tmp/v16-overlay.tar.gz.b64" | sha256sum -c -
          base64 -d /tmp/v16-overlay.tar.gz.b64 > /tmp/v16-overlay.tar.gz
          echo "5d79cce930abac99be6ca0cf620eb4fe9cb0bc432c21fbe4ee6f65909034188b  /tmp/v16-overlay.tar.gz" | sha256sum -c -
          tar -xzf /tmp/v16-overlay.tar.gz -C app
          base64 -d ci-src/v161/overlay.tar.gz.b64 > /tmp/v161-overlay.tar.gz
          tar -xzf /tmp/v161-overlay.tar.gz -C app
          base64 -d ci-src/v162/overlay.tar.gz.b64 > /tmp/v162-overlay.tar.gz
          tar -xzf /tmp/v162-overlay.tar.gz -C app
          base64 -d ci-src/v163/overlay.tar.gz.b64 > /tmp/v163-overlay.tar.gz
          echo "6123958cf0032fe503f28f8f3c28f862bac70dfda64fb2b90305677d726cf19b  /tmp/v163-overlay.tar.gz" | sha256sum -c -
          tar -xzf /tmp/v163-overlay.tar.gz -C app
          base64 -d ci-src/v164/overlay.tar.gz.b64 > /tmp/v164-overlay.tar.gz
          echo "a1d8b94bc45219410ac5e21341e59574bf12a771ae0dfacfe59c962549406894  /tmp/v164-overlay.tar.gz" | sha256sum -c -
          tar -xzf /tmp/v164-overlay.tar.gz -C app
          base64 -d ci-src/v165/overlay.tar.gz.b64 > /tmp/v165-overlay.tar.gz
          echo "8cc6d9a66dd8a1533d79ba5d61e784bd2c4db93c0db11f1130c5fa90f5f03de7  /tmp/v165-overlay.tar.gz" | sha256sum -c -
          tar -xzf /tmp/v165-overlay.tar.gz -C app
          base64 -d ci-src/v166/overlay.tar.gz.b64 > /tmp/v166-overlay.tar.gz
          echo "60c781195a457fcbacfaa856e3ad5667cb8164de41a315c980f409fa847b58b3  /tmp/v166-overlay.tar.gz" | sha256sum -c -
          tar -xzf /tmp/v166-overlay.tar.gz -C app
          base64 -d ci-src/v166fix/overlay.tar.gz.b64 > /tmp/v166fix-overlay.tar.gz
          echo "7b19c918fbd4c5eae96424441c8f5ea891010984ecbe5f3fcbfade8623416634  /tmp/v166fix-overlay.tar.gz" | sha256sum -c -
          tar -xzf /tmp/v166fix-overlay.tar.gz -C app
          base64 -d ci-src/v167/overlay.tar.gz.b64 > /tmp/v167-overlay.tar.gz
          echo "b5d1a57dc18c105a3c80229f827d6f36b1b3ccce23d6a4f53527bffc32462c00  /tmp/v167-overlay.tar.gz" | sha256sum -c -
          tar -xzf /tmp/v167-overlay.tar.gz -C app
          base64 -d ci-src/v168/overlay.tar.gz.b64 > /tmp/v168-overlay.tar.gz
          echo "92ad675644c79db5fd422a8337e0972ef65dd6e0c46cbbccbf0c1f699ab5d9df  /tmp/v168-overlay.tar.gz" | sha256sum -c -
          tar -xzf /tmp/v168-overlay.tar.gz -C app
          base64 -d ci-src/v169/overlay.tar.gz.b64 > /tmp/v169-overlay.tar.gz
          echo "2a2a0555b7b9a3d2b1545b9eeedbc6f7f4d1450d3e96fcfc4eab16b50b69a7f0  /tmp/v169-overlay.tar.gz" | sha256sum -c -
          tar -xzf /tmp/v169-overlay.tar.gz -C app
          base64 -d ci-src/v1610/overlay.tar.gz.b64 > /tmp/v1610-overlay.tar.gz
          echo '51bb870c1d4c66d6f7582c57305a3923e011d73c9f1fe1d0f6ed5acdf0bfe1bd  /tmp/v1610-overlay.tar.gz' | sha256sum -c -
          tar -xzf /tmp/v1610-overlay.tar.gz -C app
          base64 -d ci-src/v1611/overlay.tar.gz.b64 > /tmp/v1611-overlay.tar.gz
          echo '2fb67a1c835cd479180d69eb0cd8f2383e8cbe20e841eab8f519019e642563a6  /tmp/v1611-overlay.tar.gz' | sha256sum -c -
          tar -xzf /tmp/v1611-overlay.tar.gz -C app
          base64 -d ci-src/v1612/overlay.tar.gz.b64 > /tmp/v1612-overlay.tar.gz
          echo '39ff0b1b7300e7cc592d61e184d55956fe2288d38ba3e6e445b9d6cee72522cb  /tmp/v1612-overlay.tar.gz' | sha256sum -c -
          tar -xzf /tmp/v1612-overlay.tar.gz -C app
          base64 -d ci-src/v1612fix/overlay.tar.gz.b64 > /tmp/v1612fix-overlay.tar.gz
          echo 'd024a02b57c4f233450f9ada35b62f9dd55d14f2a4a9ba73b936cb63ead6834b  /tmp/v1612fix-overlay.tar.gz' | sha256sum -c -
          tar -xzf /tmp/v1612fix-overlay.tar.gz -C app
          base64 -d ci-src/v1613/overlay.tar.gz.b64 > /tmp/v1613-overlay.tar.gz
          echo '703e563db5d5798aa982c85735f354d606177d3e07512e1ba853ed970330b10c  /tmp/v1613-overlay.tar.gz' | sha256sum -c -
          tar -xzf /tmp/v1613-overlay.tar.gz -C app
          base64 -d ci-src/v1613fix/overlay.tar.gz.b64 > /tmp/v1613fix-overlay.tar.gz
          echo '204474366758fca560b0c4d4fa9c7d733aa92cc02bc7f0986a8a83357b7d3d6a  /tmp/v1613fix-overlay.tar.gz' | sha256sum -c -
          tar -xzf /tmp/v1613fix-overlay.tar.gz -C app
          base64 -d ci-src/v1614/overlay.tar.gz.b64 > /tmp/v1614-overlay.tar.gz
          echo '6eb9a2eabf61a11c3b9924edd0ad7145a5fdbf8a8a9bd30055218dcbdc8488b3  /tmp/v1614-overlay.tar.gz' | sha256sum -c -
          tar -xzf /tmp/v1614-overlay.tar.gz -C app

      - name: Apply 1.6.15 short-tap overlay
        shell: bash
        run: |
          base64 -d ci-src/v1615/overlay.tar.gz.b64 > /tmp/v1615-overlay.tar.gz
          echo "6dc608e6dadea03445e5bcd27b1585cc3f23951ed23c84b6e8c8fe16f8c1d31a  /tmp/v1615-overlay.tar.gz" | sha256sum -c -
          tar -xzf /tmp/v1615-overlay.tar.gz -C app
          python3 app/ci/generate_official_map_focus.py

      - name: Apply 1.6.16 warning map and marker overlay
        shell: bash
        run: |
          base64 -d ci-src/v1616/overlay.tar.gz.b64 > /tmp/v1616-overlay.tar.gz
          echo 'db81b40193ff89113859597b057b9444876669d245e455d9c1c2e178cc1f13c1  /tmp/v1616-overlay.tar.gz' | sha256sum -c -
          tar -xzf /tmp/v1616-overlay.tar.gz -C app
          python3 app/ci/generate_official_map_focus.py

      - name: Preserve current release version assertions
        shell: bash
        run: |
          base64 -d ci-src/v1616fix/overlay.tar.gz.b64 > /tmp/v1616fix-overlay.tar.gz
          echo '81f862cf8bf4811a684f710a47b322f2200e5dab40ca3d2eccd2e82084131839  /tmp/v1616fix-overlay.tar.gz' | sha256sum -c -
          tar -xzf /tmp/v1616fix-overlay.tar.gz -C app
      - name: Apply authoritative 1.6.21 source changes
        shell: bash
        run: |
          cat ci-src/v1621/part-* | base64 -d > /tmp/v1621-overlay.tar.gz
          echo '2113c01e8e8654e4b1331618bb9b30797496d03b82c8bd771eb0bb04174c02a3  /tmp/v1621-overlay.tar.gz' | sha256sum -c -
          tar -xzf /tmp/v1621-overlay.tar.gz -C app
          test "$(node -p "require('./app/package.json').version")" = "1.6.21"
          python3 app/ci/generate_official_map_focus.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/components/StationForecastPanel.tsx')
          original='<OfficialStationMapFrame stationBackLabel={stationBackLabel}'
          replacement="<OfficialStationMapFrame stationBackLabel={stationBackLabel === 'short' ? 'short' : stationBackLabel === 'arrow' ? 'arrow' : 'full'}"
          code=p.read_text()
          assert code.count(original)==1, 'Station back label patch drift'
          p.write_text(code.replace(original,replacement))
          test=Path('app/tests/v1621RegionControls.test.mjs')
          testcode=test.read_text()
          old=r"assert.match(station,/stationBackLabel=\{stationBackLabel\}/);"
          new=r"assert.match(station,/stationBackLabel=\{stationBackLabel === 'short' \? 'short' : stationBackLabel === 'arrow' \? 'arrow' : 'full'\}/);"
          assert testcode.count(old)==1,'Regression matcher drift'
          test.write_text(testcode.replace(old,new))
          PY

      - name: Apply Veðurspá 1.6.22 UX and localization preparation
        shell: bash
        run: |
          base64 -d ci-src/v1622/patch.gz.b64 > /tmp/v1622.patch.gz
          echo 'f1efcf35e58b283be07e75455fdb49375edd282a04f23e17fce0da14dd1cf3c4  /tmp/v1622.patch.gz' | sha256sum -c -
          gzip -dc /tmp/v1622.patch.gz > /tmp/v1622.patch
          # Documentation in the CI reconstruction comes from an older baseline;
          # only three text-only record files are skipped, never app/test source.
          python3 - <<'PY'
          from pathlib import Path
          original=Path('/tmp/v1622.patch').read_text()
          kept=[];skip=False
          for line in original.splitlines(keepends=True):
            if line.startswith('diff -ruN '):
              skip=any(line.rstrip().endswith('/'+name) for name in ('AI_HANDOFF.md','BUILD_INFO.md','TEST_RESULTS.md'))
            if not skip:kept.append(line)
          Path('/tmp/v1622-code.patch').write_text(''.join(kept))
          PY
          patch -p1 -d app < /tmp/v1622-code.patch
          python3 app/ci/generate_official_map_focus.py
          test "$(node -p "require('./app/package.json').version")" = "1.6.22"

      - name: Update component lifecycle mocks for new imports
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/tests/stationKeepAlive.test.mjs')
          s=p.read_text()
          anchor="'../utils/officialStationMap':{openOriginalStationMap:async()=>{}}"
          assert s.count(anchor)==1
          s=s.replace(anchor,anchor+",'lucide-react':{ArrowLeft:()=>null},'../i18n':{t:key=>key==='station.iceland'?'Ísland':'Aftur til Íslands'}")
          p.write_text(s)
          PY

      - name: Apply Veðurspá 1.6.23 cleanup source
        shell: bash
        run: |
          base64 -d ci-src/v1623/overlay.tar.gz.b64 > /tmp/v1623-overlay.tar.gz
          echo 'd3c0531d708b9eef04df388fa067ed611996a2f0d4105b2d0631ef9dae1c2875  /tmp/v1623-overlay.tar.gz' | sha256sum -c -
          tar -xzf /tmp/v1623-overlay.tar.gz -C app
          rm -f app/public/history-feature.js
          test "$(node -p "require('./app/package.json').version")" = "1.6.23"
          node app/tests/v1623Cleanup.test.mjs

      - name: Apply version-agnostic regression test fix
        shell: bash
        run: |
          base64 -d ci-src/v1623/testfix.tar.gz.b64 > /tmp/v1623testfix.tar.gz
          echo '48c5d8dabfcead3c2b673963f6a310cbca2a40a662898b784ed7a7ba8f083415  /tmp/v1623testfix.tar.gz' | sha256sum -c -
          tar -xzf /tmp/v1623testfix.tar.gz -C app
          node app/tests/v1616Regression.test.mjs

      - name: Apply Veðurspá 1.6.24 live-clock and UI compatibility patch
        shell: bash
        run: |
          base64 -d ci-src/v1624/live-clock.patch.gz.b64 > /tmp/v1624.patch.gz
          echo '3074b849baa915075ac1508924c9aaaa335170554b599320c4292430921028a1  /tmp/v1624.patch.gz' | sha256sum -c -
          gzip -dc /tmp/v1624.patch.gz > /tmp/v1624.patch
          patch --batch -p1 -d app < /tmp/v1624.patch
          test "$(node -p "require('./app/package.json').version")" = "1.6.24"
          node app/tests/v1624LiveClockRegression.test.mjs

      - name: Apply Veðurspá 1.6.25 responsive aurora/clock styling
        shell: bash
        run: |
          base64 -d ci-src/v1625/aurora-layout.patch.gz.b64 > /tmp/v1625.patch.gz
          echo '52e8c303ad638123ed73c04d30c2b1c9a118fb7f517a33fcab65cd0fab9bc4aa  /tmp/v1625.patch.gz' | sha256sum -c -
          gzip -dc /tmp/v1625.patch.gz | patch --batch -p1 -d app
          python3 - <<'PY'
          from pathlib import Path
          root=Path('app')
          p=root/'package.json';s=p.read_text();s=s.replace('"version": "1.6.24"','"version": "1.6.25"');s=s.replace('node --import tsx tests/liveClock.test.mjs"', 'node --import tsx tests/liveClock.test.mjs && node --import tsx tests/v1625AuroraLayout.test.mjs"');p.write_text(s)
          p=root/'package-lock.json';s=p.read_text().replace('"version": "1.6.24"','"version": "1.6.25"');p.write_text(s)
          p=root/'ci/patch_android.py';s=p.read_text();s=s.replace("'versionCode 31'", "'versionCode 32'").replace("'versionName \"1.6.24\"'","'versionName \"1.6.25\"'");p.write_text(s)
          PY
          test "$(node -p "require('./app/package.json').version")" = "1.6.25"

      - name: Apply Veðurspá 1.6.26 compact aurora strip
        shell: bash
        run: |
          base64 -d ci-src/v1626/compact-aurora.patch.gz.b64 > /tmp/v1626.patch.gz
          echo '961c7b3822e69e201896f8333d48c1148eb87e9f508c831d1279beeff5af432b  /tmp/v1626.patch.gz' | sha256sum -c -
          gzip -dc /tmp/v1626.patch.gz > /tmp/v1626.patch
          # The rebuilt baseline modifies this generator's previous version token
          # differently from the standalone complete-source ZIP.
          sed '/^--- a\/ci\/patch_android.py/,$d' /tmp/v1626.patch | patch --batch -p1 -d app
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/ci/patch_android.py')
          s=p.read_text()
          assert "'versionCode 32'" in s and "'versionName \"1.6.25\"'" in s
          s=s.replace("'versionCode 32'","'versionCode 33'").replace("'versionName \"1.6.25\"'","'versionName \"1.6.26\"'")
          # Preserve any original allow-list and accept the newest upgrade versions.
          s=s.replace(r"|31)\b",r"|31|32|33)\b").replace(r"1\.6\.24)",r"1\.6\.24|1\.6\.25|1\.6\.26)")
          p.write_text(s)
          p=Path('app/package.json')
          s=p.read_text()
          needle='node --import tsx tests/v1625AuroraLayout.test.mjs"'
          assert needle in s
          p.write_text(s.replace(needle,'node --import tsx tests/v1625AuroraLayout.test.mjs && node --import tsx tests/v1626CompactAurora.test.mjs"'))
          # Prior-version behavioral assertions stay, but their version pin evolves.
          p=Path('app/tests/v1624LiveClockRegression.test.mjs')
          s=p.read_text().replace("version, '1.6.25'","version, '1.6.26'").replace('taller two-row layout','compact single-row layout')
          p.write_text(s)
          p=Path('app/tests/v1626CompactAurora.test.mjs')
          s=p.read_text()
          s=s.replace("assert.doesNotMatch(source,/grid-cols-2/,'remove tall two-row layout');",
              "assert.doesNotMatch(source.match(/<div id=\"aurora-controls-grid\"[^>]*>/)?.[0]||'',/grid-cols-2/,'no tall two-row controls');")
          p.write_text(s)
          PY
          test "$(node -p "require('./app/package.json').version")" = "1.6.26"

      - name: Apply Veðurspá 1.6.27 updater and rain/snow icon overlay
        shell: bash
        run: |
          base64 -d ci-src/v1627/overlay.tar.xz.b64 > /tmp/v1627-overlay.tar.xz
          echo 'a68ff2e24283130e53307d5a9a1eabed5fbd1ee26786b4728e1ebc8e0c2fd7c9  /tmp/v1627-overlay.tar.xz' | sha256sum -c -
          tar -xJf /tmp/v1627-overlay.tar.xz -C app
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('app')
          lock=root/'package-lock.json'
          data=json.loads(lock.read_text())
          data['version']='1.6.27'
          data['packages']['']['version']='1.6.27'
          lock.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')
          assert json.loads((root/'package.json').read_text())['version']=='1.6.27'
          PY
          test -s app/assets/app-icons/build-master.jpg

      - name: Apply 1.6.28 patch-only update
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('app')
          for filename in ('package.json','package-lock.json'):
              p=root/filename
              data=json.loads(p.read_text())
              assert data['version']=='1.6.27',filename
              data['version']='1.6.28'
              if filename=='package-lock.json':
                  data['packages']['']['version']='1.6.28'
              else:
                  data['scripts']['test'] += ' && node --import tsx tests/v1628UpdateSmoke.test.mjs'
              p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          p=root/'ci/patch_android.py'
          s=p.read_text()
          assert 'versionCode 34' in s and 'versionName "1.6.27"' in s
          s=s.replace('versionCode 34','versionCode 35').replace('versionName "1.6.27"','versionName "1.6.28"')
          s=s.replace('|33|34)', '|33|34|35)').replace(r'1\.6\.27)',r'1\.6\.27|1\.6\.28)')
          p.write_text(s)
          for filename in ('v1623Cleanup.test.mjs','v1624LiveClockRegression.test.mjs','v1625AuroraLayout.test.mjs'):
              p=root/'tests'/filename
              p.write_text(p.read_text().replace("'1.6.27'","'1.6.28'"))
          (root/'tests/v1628UpdateSmoke.test.mjs').write_text("""import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { compareVersions } from '../src/utils/appUpdate.ts';
          const pkg=JSON.parse(readFileSync(new URL('../package.json',import.meta.url),'utf8'));
          const lock=JSON.parse(readFileSync(new URL('../package-lock.json',import.meta.url),'utf8'));
          assert.equal(pkg.version,'1.6.28');
          assert.equal(lock.version,'1.6.28');
          assert.equal(lock.packages[''].version,'1.6.28');
          assert.equal(compareVersions('v1.6.28','1.6.27'),1);
          assert.equal(compareVersions('1.6.28','v1.6.28'),0);
          const patcher=readFileSync(new URL('../ci/patch_android.py',import.meta.url),'utf8');
          assert.match(patcher,/versionCode 35/);
          assert.match(patcher,/versionName "1\.6\.28"/);
          console.log('Veðurspá 1.6.28 version/update smoke PASS');
          """)
          (root/'RELEASE_NOTES_1.6.28.md').write_text("""# Veðurspá 1.6.28 — Update test

          - Version update from 1.6.27 to 1.6.28 to test in-app updates.
          - No changes to weather data, maps, UI, settings or caches.
          - Android versionCode increased from 34 to 35 for an in-place upgrade.
          - Download Android APK, Windows ZIP and source ZIP below.

          Test with v1.6.27: Settings → Uppfærsla og patch notes → Athuga núna; verify 1.6.28 appears.
          """)
          PY
          test "$(node -p "require('./app/package.json').version")" = '1.6.28'
          python3 -m py_compile app/ci/patch_android.py

      - name: Prepare approved Veðurspá artwork and source handoff
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check --break-system-packages Pillow
          python3 app/ci/generate_app_icons.py
          cat > app/AI_HANDOFF.md <<'END_HANDOFF'
          # AI_HANDOFF — Veðurspá 1.6.28
          
          Purpose/state: Icelandic weather forecast app (React 19, TypeScript, Vite) for Android Capacitor and portable Windows Go launcher. Current version 1.6.28, Android package is.viktor.vedurspa, versionCode 35. Source ZIP is authoritative.
          
          Architecture: src/App.tsx manages active forecast, maps, timeline, cached weather, warnings and modes. src/components/AppSettingsPanel.tsx exposes Settings and GitHub release update checks; src/utils/appUpdate.ts provides typed GitHub release metadata, semantic numeric version comparison, and tag fallback; src/utils/externalLink.ts and native-src/is/viktor/vedurspa/ExternalLinkPlugin.java open GitHub safely in system browser on Android. src/components/NorthernLightsBar.tsx keeps four compact aurora controls. src/components/StationForecastPanel.tsx / OfficialStationMapFrame.tsx integrate official Staðaspá. src/utils and src/officialAdapter contain forecast/cache/provider contracts; native-src hosts Android plugins.
          
          Dependencies/config: package.json / package-lock.json; Capacitor 6, Java 17, Android SDK, npm, Go 1.22, Pillow (icon generation in CI). capacitor.config.json fixes appId. No persisted settings migration or provider schema changes. Existing debug signing key and permissions retained for compatibility. Do not replace signing keystore.
          
          Release: approved aurora artwork with rain left / snow right is kept as docs/approved-aurora-rain-left-snow-right.png; compact JPG master assets/app-icons/build-master.jpg is rendered by ci/generate_app_icons.py to web PNG, Apple touch icon, Android launcher PNGs and Windows ICO. Settings shows installed version, GitHub latest release notes, version comparison and APK/PC/source links; if no release exists it falls back to latest tag. This is a download/link updater, not silent self-install.
          
