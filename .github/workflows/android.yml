      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Check web app
        working-directory: app
        run: |
          npm run lint
          npm test
          npm run build

      - name: Generate Android project
        working-directory: app
        run: |
          npx cap add android
          npx cap sync android
          python3 ci/patch_android.py
          chmod +x android/gradlew

      - name: Build signed debug APK
        working-directory: app/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify APK
        working-directory: app
        shell: bash
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -Fi "273b709d3ed9a5376d9d1f14811c7d1a13c52a04d4266b5a7eeb9a85e9e7841d" /tmp/apksigner.txt
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -F "package: name='is.viktor.vedurspa' versionCode='38' versionName='1.6.31'" /tmp/badging.txt
          cp "$APK" Vedurspa-1.6.31.apk
          sha256sum Vedurspa-1.6.31.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Vedurspa-1.6.31
          path: app/Vedurspa-1.6.31.apk
          if-no-files-found: error

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build portable PC HTML launcher
        shell: bash
        working-directory: app
        run: |
          mkdir -p ../pc-bundle/web
          cp -a dist/. ../pc-bundle/web/
          cp assets/app-icons/app-icon.ico ../pc-bundle/Veðurspá.ico
          (cd ci && GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o ../../pc-bundle/Vedurspa-PC.exe .)
          printf '@echo off\r\ncd /d "%%~dp0"\r\nVedurspa-PC.exe\r\n' > "../pc-bundle/Start Veðurspá.bat"
          cp "../pc-bundle/Start Veðurspá.bat" "../pc-bundle/Start-Vedurspa.bat"
          printf 'Veðurspá 1.6.31 for Windows. Extract everything. Double-click Start-Vedurspa.bat. The launcher serves web files on 127.0.0.1 only and proxies https://vedur.is. Requires internet for live weather.\n' > ../pc-bundle/README.txt
          (cd ../pc-bundle && zip -qr ../Vedurspa-PC-HTML-1.6.31.zip .)
          unzip -t ../Vedurspa-PC-HTML-1.6.31.zip | tail -n 1

      - uses: actions/upload-artifact@v4
        with:
          name: Vedurspa-PC-HTML-1.6.31
          path: Vedurspa-PC-HTML-1.6.31.zip
          if-no-files-found: error

      - name: Package authoritative Veðurspá 1.6.31 source ZIP
        shell: bash
        run: |
          mkdir -p app/.github/workflows
          cp .github/workflows/android.yml app/.github/workflows/build-release.yml
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          root=Path('app')
          excluded={'node_modules','dist','android','.git','build','__pycache__','.gradle','pc-bundle'}
          with ZipFile('Vedurspa-1.6.31-complete-source.zip','w',ZIP_DEFLATED,strict_timestamps=False) as z:
              for path in sorted(root.rglob('*')):
                  if not path.is_file() or any(part in excluded for part in path.parts) or path.name.endswith(('.pyc','.log','.tmp')):
                      continue
                  z.write(path,path.relative_to(root))
          PY
          unzip -t Vedurspa-1.6.31-complete-source.zip | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: Vedurspa-1.6.31-source
          path: Vedurspa-1.6.31-complete-source.zip
          if-no-files-found: error

      - name: Publish verified v1.6.31 release and patch notes
        if: github.ref == 'refs/heads/ci-build-vedurspa-1.6.31-final-icon-ui' && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.6.31 >/dev/null 2>&1; then
            gh release upload v1.6.31 app/Vedurspa-1.6.31.apk Vedurspa-PC-HTML-1.6.31.zip Vedurspa-1.6.31-complete-source.zip --clobber
          else
            gh release create v1.6.31 \
              app/Vedurspa-1.6.31.apk \
              Vedurspa-PC-HTML-1.6.31.zip \
              Vedurspa-1.6.31-complete-source.zip \
              --target "$GITHUB_SHA" \
              --title "Veðurspá 1.6.31 — Languages and illustrated guides" \
              --notes-file app/RELEASE_NOTES_1.6.31.md \
              --latest
          fi
          gh release view v1.6.31 --json tagName,isDraft,assets --jq '{tagName,isDraft,assets:[.assets[].name]}'
