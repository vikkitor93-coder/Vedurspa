name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source
        shell: bash
        run: |
          cat ci-src/part-* > /tmp/vedurspa-source.zip
          echo "dccbb8a68cae3443447bbe488e3ac1f8bf96dafce274b0020b1c8e8b3d51a563  /tmp/vedurspa-source.zip" | sha256sum -c -
          mkdir -p app
          unzip -q /tmp/vedurspa-source.zip -d app
          base64 -d ci-src/v12.patch.gz.b64 | gunzip > /tmp/v12.patch
          patch -p1 -d app < /tmp/v12.patch
          patch -p1 -d app < ci-src/v12fix.patch
          base64 -d ci-src/v13.patch.gz.b64 | gunzip > /tmp/v13.patch
          patch -p1 -d app < /tmp/v13.patch
          cat ci-src/v15/part-* > /tmp/v15.patch.gz.b64
          echo "48f57b34c80cf2c823c95a36f1951e853c512530daa65b3c6e53f2ce4cedb7ae  /tmp/v15.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/v15.patch.gz.b64 | gunzip > /tmp/v15.patch
          echo "ac3a61871b9971f3eb45231bddc49eec9931c0ce9b99113880c4d38316508132  /tmp/v15.patch" | sha256sum -c -
          patch -p1 -d app < /tmp/v15.patch

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Check web app
        working-directory: app
        run: |
          npm run lint
          npm test
          npm run build

      - name: Generate Android project
        working-directory: app
        run: |
          npx cap add android
          npx cap sync android
          python3 ci/patch_android.py
          chmod +x android/gradlew

      - name: Build signed debug APK
        working-directory: app/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify APK
        working-directory: app
        shell: bash
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -Fi "273b709d3ed9a5376d9d1f14811c7d1a13c52a04d4266b5a7eeb9a85e9e7841d" /tmp/apksigner.txt
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -F "package: name='is.viktor.vedurspa' versionCode='6' versionName='1.5'" /tmp/badging.txt
          cp "$APK" Vedurspa-1.5.apk
          sha256sum Vedurspa-1.5.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Vedurspa-1.5
          path: app/Vedurspa-1.5.apk
          if-no-files-found: error
