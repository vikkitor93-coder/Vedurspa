          path: Vedurspa-PC-HTML-1.6.35.zip
          if-no-files-found: error

      - name: Package authoritative Veðurspá 1.6.35 source ZIP
        shell: bash
        run: |
          mkdir -p app/.github/workflows
          cp .github/workflows/android.yml app/.github/workflows/build-release.yml
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          root=Path('app')
          excluded={'node_modules','dist','android','.git','build','__pycache__','.gradle','pc-bundle'}
          with ZipFile('Vedurspa-1.6.35-complete-source.zip','w',ZIP_DEFLATED,strict_timestamps=False) as z:
              for path in sorted(root.rglob('*')):
                  if not path.is_file() or any(part in excluded for part in path.parts) or path.name.endswith(('.pyc','.log','.tmp','.apk')):
                      continue
                  z.write(path,path.relative_to(root))
          PY
          unzip -t Vedurspa-1.6.35-complete-source.zip | tail -1
          if unzip -Z1 Vedurspa-1.6.35-complete-source.zip | grep -q '\.apk'; then echo 'Unexpected APK in source ZIP'; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: Vedurspa-1.6.35-source
          path: Vedurspa-1.6.35-complete-source.zip
          if-no-files-found: error

      - name: Publish verified v1.6.35 release and patch notes
        if: github.ref == 'refs/heads/ci-build-vedurspa-1.6.35-warnings-aurora-slider' && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.6.35 >/dev/null 2>&1; then
            gh release upload v1.6.35 app/Vedurspa-1.6.35.apk Vedurspa-PC-HTML-1.6.35.zip Vedurspa-1.6.35-complete-source.zip --clobber
          else
            gh release create v1.6.35 \
              app/Vedurspa-1.6.35.apk \
              Vedurspa-PC-HTML-1.6.35.zip \
              Vedurspa-1.6.35-complete-source.zip \
              --target "$GITHUB_SHA" \
              --title "Veðurspá 1.6.35 — Warning header and updater progress" \
              --notes-file app/RELEASE_NOTES_1.6.35.md \
              --latest
          fi
          gh release view v1.6.35 --json tagName,isDraft,assets --jq '{tagName,isDraft,assets:[.assets[].name]}'
