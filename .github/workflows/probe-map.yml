name: Inspect official Stadaspa map structure
on:
  push:
    branches: [vedurspa-1.6.8-inframe-official]
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download original HTML
        shell: bash
        run: |
          curl --fail --location --silent --show-error --retry 2 --max-time 40 --dump-header headers.txt 'https://www.vedur.is/vedur/spar/stadaspar/' -o imo.html
          wc -c imo.html
          grep -iE 'x-frame-options|content-security-policy|content-type' headers.txt || true
      - name: Inspect map containers and JS
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          class P(HTMLParser):
              def __init__(self): super().__init__();self.depth=0;self.tags=0
              def handle_starttag(self,t,a):
                  d=dict(a);self.tags+=1
                  signal=' '.join(str(d.get(k,'')) for k in ['id','class','src','data-type','role','name']).lower()
                  if (any(w in signal for w in ['map','weather','spakort','stad','forecast','iframe','tabs','wmap','smap','diagram','station']) or t in ['script','canvas','svg','iframe']):
                      print(self.tags,t,repr({k:v for k,v in d.items() if k in ['id','class','src','href','type','name','data-type','role']}))
          p=P();p.feed(open('imo.html').read());print('TAG_COUNT',p.tags)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: imo-map-page-evidence
          path: |
            imo.html
            headers.txt
