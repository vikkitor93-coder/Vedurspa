name: Inspect Vedur observation sources
on:
  push:
    paths:
      - '.github/workflows/inspect-observations.yml'
      - 'ci-src/inspect-trigger.txt'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Vedur pages and scripts
        shell: bash
        run: |
          python3 - <<'PY'
          import re, urllib.parse, urllib.request
          pages=[
            'https://www.vedur.is/vedur/athuganir/kort/',
            'https://www.vedur.is/vedur/athuganir/vedurradar/',
            'https://www.vedur.is/vedur/athuganir/vedurtungl/hitamyndir',
            'http://brunnur.vedur.is/athuganir/athuganir.html',
          ]
          pat=re.compile(r'wmap|athugan|observ|radar|vedurradar|satell|vedurtungl|imgConf|slider|timestamp|date|dagur|klst|gif|png|jpg',re.I)
          for page in pages:
              print('\n######## PAGE',page,'########')
              try:
                  html=urllib.request.urlopen(page,timeout=30).read().decode('utf-8','replace')
              except Exception as e:
                  print('PAGE_FAIL',e); continue
              for line in html.splitlines():
                  if pat.search(line):
                      print(line[:1800])
              srcs=re.findall(r'<script[^>]+src=["\']([^"\']+)',html,re.I)
              for src in srcs:
                  url=urllib.parse.urljoin(page,src)
                  try:
                      txt=urllib.request.urlopen(url,timeout=20).read().decode('utf-8','replace')
                  except Exception as e:
                      print('SCRIPT_FAIL',url,e); continue
                  hits=[line[:2200] for line in txt.splitlines() if pat.search(line)]
                  if hits:
                      print('\n--- SCRIPT',url,'---')
                      print('\n'.join(hits[:160]))
          PY
