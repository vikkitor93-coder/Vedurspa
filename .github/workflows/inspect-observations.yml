name: Inspect Vedur observation sources
on:
  push:
    paths:
      - '.github/workflows/inspect-observations.yml'
      - 'ci-src/inspect-trigger.txt'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify historical radar archive
        shell: bash
        run: |
          mkdir inspect
          curl -L --fail --silent --show-error 'https://www.vedur.is/vedur/athuganir/kort/' -o inspect/observations.html
          curl -L --fail --silent --show-error 'https://www.vedur.is/wstations/wslinfo.js?v=538' -o inspect/wslinfo.js
          for product in             radar_COMP_iceland_sri-comp-sri_dBR_20260922_0700.png             radar_COMP_RTR-rtr__20260922_0700.png; do
            url="https://www.vedur.is/gogn/myndir/radar/2026/09/22/${product}"
            echo "CHECK ${url}"
            if curl -L --fail --silent --show-error "${url}" -o "inspect/${product}"; then
              file "inspect/${product}"
              sha256sum "inspect/${product}"
            else
              echo "MISSING ${product}"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: vedur-radar-archive-reference
          path: inspect
          if-no-files-found: error
