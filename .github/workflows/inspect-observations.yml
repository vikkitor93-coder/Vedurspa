name: Inspect Vedur observation sources
on:
  push:
    paths:
      - '.github/workflows/inspect-observations.yml'
      - 'ci-src/inspect-trigger.txt'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download observation implementation
        shell: bash
        run: |
          mkdir inspect
          curl -L --fail --silent --show-error 'https://www.vedur.is/vedur/athuganir/kort/' -o inspect/observations.html
          curl -L --fail --silent --show-error 'https://www.vedur.is/js/vi-base.js?v=538' -o inspect/vi-base.js
          curl -L --fail --silent --show-error 'https://www.vedur.is/js/vi-res_is.js?v=538' -o inspect/vi-res_is.js
          curl -L --fail --silent --show-error 'https://www.vedur.is/vedur/athuganir/vedurradar/' -o inspect/radar.html
          curl -L --fail --silent --show-error 'https://www.vedur.is/vedur/athuganir/vedurtungl/hitamyndir' -o inspect/satellite.html
      - uses: actions/upload-artifact@v4
        with:
          name: vedur-observation-inspection
          path: inspect
          if-no-files-found: error
