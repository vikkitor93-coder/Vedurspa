name: Inspect Vedur observation sources
on:
  push:
    paths:
      - '.github/workflows/inspect-observations.yml'
      - 'ci-src/inspect-trigger.txt'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact observation implementation
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request
          urls={
            'page':'https://www.vedur.is/vedur/athuganir/kort/',
            'base':'https://www.vedur.is/js/vi-base.js?v=538',
            'res':'https://www.vedur.is/js/vi-res_is.js?v=538',
          }
          texts={}
          for k,u in urls.items():
              texts[k]=urllib.request.urlopen(u,timeout=30).read().decode('utf-8','replace')
          def around(label,text,term,radius=7000):
              print('\n###',label,term,'###')
              pos=text.find(term)
              print('POS',pos)
              if pos>=0: print(text[max(0,pos-radius):pos+radius])
          for term in ['initObsWMap','dispTimePos','grpDataQPath','WeatherServlet','MapCtrl=function','VI.utils.MapCtrl','mapCallBacks']:
              around('vi-base',texts['base'],term)
          for term in ['wmapSrc','tInfo','wTime','wsGroups','wInfo','sliderLen','defGrp','now']:
              around('obs-page',texts['page'],term,4500)
          PY
